<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rzeczywisty viewport — staging</title>
<style>body{font:15px system-ui;margin:0;padding:10px}iframe{border:0;display:block;height:1000px}header{position:sticky;left:0;top:0;background:white;padding:10px;z-index:2;width:650px;max-width:95vw}button,select{font:inherit;padding:8px}pre{white-space:pre-wrap;font-size:12px}</style>
<header><strong>Test tego samego wdrożonego panelu w ramce o rzeczywistym viewport.</strong><p>390, 430, 768, 1366 px; szerokość jest odczytywana z dokumentu aplikacji. Brak kopii CSS i atrap danych.</p><select aria-label="Szerokość"><option>390</option><option>430</option><option>768</option><option>1366</option></select><button id="measure">Pomiar</button><pre id="measurements">Ładowanie</pre></header><iframe id="app" title="Panel — test responsywności"></iframe>
<script>
if(!location.hostname.endsWith('-staging.netlify.app'))throw Error('Staging only');
const frame=document.querySelector('iframe'),sizes=document.querySelector('select'),result=document.querySelector('pre');
function measure(){const d=frame.contentDocument;if(!d)return;const width=d.documentElement.clientWidth;const overflow=[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>width+1||r.left< -1)&&getComputedStyle(e).position!=='fixed';}).slice(0,15).map(e=>({tag:e.tagName,id:e.id,cls:e.className,right:Math.round(e.getBoundingClientRect().right)}));result.textContent=JSON.stringify({requested:Number(sizes.value),actual:width,scrollWidth:d.documentElement.scrollWidth,overflow},null,2);}
sizes.onchange=()=>{frame.style.width=sizes.value+'px';measure();};document.querySelector('#measure').onclick=measure;
(async()=>{const r=await fetch('/',{cache:'no-store'});if(!r.ok)throw Error('Source unavailable');let html=await r.text();html=html.replace('<head>','<head><base href="'+location.origin+'/">');frame.style.width=sizes.value+'px';frame.onload=measure;frame.srcdoc=html;})();
</script></html>
